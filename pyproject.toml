[project]
name = "pdftoceditor"
version = "0.0.0"
description = "Python tool for editing PDF table of contents using simple text files with replace, append, and dump operations."
authors = [{ name="Simone Gaiarin", email="simgunz@gmail.com"}]
license = { file = "LICENSE" }
packages = [
  { include = "pdftoceditor", from = "src" },
]
requires-python = "~=3.12.0"
dependencies = [
  "typer~=0.16.0",
  "docopt>=0.6.2,<0.7.0",
]

[dependency-groups]
dev=[
  "pytest~=8.4",
  "ruff~=0.11.12",
  "pytest-mock~=3.11",
  "black~=25.1",
  "pre-commit~=4.2",
  "bump2version~=1.0",
  "detect-secrets~=1.4",
]

[project.scripts]
pdftoceditor = "pdftoceditor.cli:app"

# This may change in the future once the `uv` build backend
# is out of preview
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdftoceditor"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]

select = [
    "E", # pycodestyle, basic flake8
    "W", # pycodestyle, basic flake8
    "F", # pyflakes, basic flake8
    "N", # pep8-naming, basic flake8
    "A",  # flake8-builtins,
    "D", # pydocstyle
    "PT", # flake8-pytest-style
    "T20", # flake8-print
    "ERA", # eradicate
    "B", # flake8-bugbear
    "C90", # maccabe, basic flake8
    "I" # isort
]
ignore = [
    # Docstring rules
    "D100",   # Ignore missing docstring in public modules
    "D104",   # Ignore missing docstring in public packages
    "D105",   # Ignore missing docstring in magic methods
    # Bugbear rules
    "B904"   # Ignore exception-raises-generic
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/pdftoceditor/cli.py" = ["T20"]
"__init__.py" = ["F401"]
"**/{tests}/*" = ["D1"]
"**/{docs,notebooks}/*" = ["T20", "S101", "E402", "D"]

# T20: Forbid the use of print
# S101: Forbid the use of assert
# F401: Ignore imported modules not used in __init__.py files
# E402: Ignore all module level imports should be at the top of the file.
# D: Ignore all docstring errors in autogenerated code

[tool.pytest.ini_options]
pythonpath = "src"

[tool.mypy]
exclude = ["tests/*"]
follow_imports = "normal"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
